<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operating Rooms | Hospital Command Center</title>

    <link rel="stylesheet" href="operating-rooms.css">
</head>

<body>

    <div class="page-container">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <div>
                <h1>OPERATING ROOMS</h1>
                <p>Monitor operating room availability and current procedures</p>
            </div>

            <button class="refresh-btn" onclick="loadOperatingRooms()">
                ↻ Refresh
            </button>
        </div>


        <!-- SUMMARY -->
        <div class="summary-grid">

            <div class="summary-card">
                <span class="summary-label">TOTAL ORs</span>
                <strong id="totalORs">0</strong>
            </div>

            <div class="summary-card available">
                <span class="summary-label">AVAILABLE</span>
                <strong id="availableORs">0</strong>
            </div>

            <div class="summary-card occupied">
                <span class="summary-label">OCCUPIED</span>
                <strong id="occupiedORs">0</strong>
            </div>

            <div class="summary-card cleaning">
                <span class="summary-label">CLEANING</span>
                <strong id="cleaningORs">0</strong>
            </div>

            <div class="summary-card maintenance">
                <span class="summary-label">MAINTENANCE</span>
                <strong id="maintenanceORs">0</strong>
            </div>

        </div>


        <!-- OPERATING ROOM LIST -->
        <div class="content-section">

            <div class="section-title">
                <h2>Operating Room Status</h2>
                <span id="lastUpdated">Last updated: --</span>
            </div>

            <div id="orGrid" class="or-grid">
                <!-- OR cards generated by JavaScript -->
            </div>

        </div>

    </div>


    <!-- OR DETAILS MODAL -->
    <div id="orModal" class="modal">

        <div class="modal-content">

            <button class="close-btn" onclick="closeORModal()">×</button>

            <div class="modal-header">
                <span id="modalORNumber">OR-02</span>
                <span id="modalStatus" class="status-badge occupied">
                    OCCUPIED
                </span>
            </div>

            <div class="details-container">

                <div class="detail-row">
                    <span>Current Procedure</span>
                    <strong id="modalProcedure">--</strong>
                </div>

                <div class="detail-row">
                    <span>Surgeon</span>
                    <strong id="modalSurgeon">--</strong>
                </div>

                <div class="detail-row">
                    <span>Specialization</span>
                    <strong id="modalSpecialization">--</strong>
                </div>

                <div class="detail-row">
                    <span>Expected Completion</span>
                    <strong id="modalCompletion">--</strong>
                </div>

                <div class="detail-row">
                    <span>Status</span>
                    <strong id="modalStatusText">--</strong>
                </div>

            </div>

        </div>

    </div>


    <script src="operating-rooms.js"></script>

</body>
<body>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

.page-container {
    max-width: 1400px;
    margin: auto;
    padding: 35px;
}


/* ================= HEADER ================= */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-header h1 {
    font-size: 30px;
    font-weight: 700;
    color: #172033;
    letter-spacing: 0.5px;
}

.page-header p {
    margin-top: 8px;
    color: #6b7280;
    font-size: 14px;
}

.refresh-btn {
    border: none;
    background: #172033;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.refresh-btn:hover {
    background: #273449;
}


/* ================= SUMMARY ================= */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.summary-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
}

.summary-label {
    display: block;
    font-size: 12px;
    color: #6b7280;
    font-weight: 600;
    margin-bottom: 10px;
}

.summary-card strong {
    font-size: 28px;
    color: #172033;
}

.summary-card.available {
    border-left: 5px solid #22c55e;
}

.summary-card.occupied {
    border-left: 5px solid #ef4444;
}

.summary-card.cleaning {
    border-left: 5px solid #f59e0b;
}

.summary-card.maintenance {
    border-left: 5px solid #6b7280;
}


/* ================= CONTENT ================= */

.content-section {
    background: white;
    padding: 28px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.section-title h2 {
    font-size: 20px;
    color: #172033;
}

.section-title span {
    font-size: 12px;
    color: #6b7280;
}


/* ================= OR GRID ================= */

.or-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.or-card {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 22px;
    background: #ffffff;
    cursor: pointer;
    transition: 0.2s ease;
    position: relative;
}

.or-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

.or-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.or-number {
    font-size: 20px;
    font-weight: 700;
    color: #172033;
}

.status-badge {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
}


/* STATUS COLORS */

.status-available {
    color: #15803d;
    background: #dcfce7;
}

.status-occupied {
    color: #b91c1c;
    background: #fee2e2;
}

.status-cleaning {
    color: #b45309;
    background: #fef3c7;
}

.status-maintenance {
    color: #4b5563;
    background: #e5e7eb;
}


/* ================= CARD DETAILS ================= */

.or-info {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.info-row span {
    color: #6b7280;
    font-size: 13px;
}

.info-row strong {
    font-size: 13px;
    color: #172033;
    text-align: right;
}

.available-message {
    margin-top: 12px;
    padding: 12px;
    background: #f0fdf4;
    color: #15803d;
    border-radius: 8px;
    font-size: 13px;
}


/* ================= MODAL ================= */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 550px;
    border-radius: 16px;
    padding: 30px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.close-btn {
    position: absolute;
    right: 20px;
    top: 18px;
    border: none;
    background: transparent;
    font-size: 28px;
    cursor: pointer;
    color: #6b7280;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-right: 35px;
    margin-bottom: 28px;
}

.modal-header span:first-child {
    font-size: 25px;
    font-weight: 700;
    color: #172033;
}


/* ================= DETAILS ================= */

.details-container {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #edf0f2;
}

.detail-row span {
    color: #6b7280;
    font-size: 14px;
}

.detail-row strong {
    color: #172033;
    font-size: 14px;
    text-align: right;
}


/* ================= RESPONSIVE ================= */

@media (max-width: 1000px) {

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .or-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {

    .page-container {
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .or-grid {
        grid-template-columns: 1fr;
    }

    .section-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
}
    </style>
</body>
<body>
    <script>
        // ======================================================
// API CONFIGURATION
// ======================================================

// Change this to your actual backend URL
const API_BASE_URL = "http://localhost:5000/api";


// ======================================================
// LOAD OPERATING ROOMS
// ======================================================

async function loadOperatingRooms() {

    const orGrid = document.getElementById("orGrid");

    orGrid.innerHTML = `
        <p style="color:#6b7280;">
            Loading operating room information...
        </p>
    `;

    try {

        /*
         * Fetch operating-room information from backend.
         *
         * Example:
         * GET /api/operating-rooms
         */

        const response = await fetch(
            `${API_BASE_URL}/operating-rooms`,
            {
                method: "GET",
                credentials: "include"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to load operating rooms");
        }

        const rooms = await response.json();

        /*
         * The backend should return something similar to:
         *
         * [
         *   {
         *     id: "OR-01",
         *     status: "AVAILABLE"
         *   },
         *   {
         *     id: "OR-02",
         *     status: "OCCUPIED",
         *     procedure: "Cardiac Surgery",
         *     surgeonId: "doctor_id"
         *   }
         * ]
         */

        renderOperatingRooms(rooms);

        updateSummary(rooms);

        document.getElementById("lastUpdated").textContent =
            "Last updated: " + new Date().toLocaleTimeString();

    } catch (error) {

        console.error(error);

        orGrid.innerHTML = `
            <div style="
                padding:20px;
                background:#fef2f2;
                color:#b91c1c;
                border-radius:8px;
            ">
                Unable to load operating room data.
                Check your backend connection.
            </div>
        `;
    }
}


// ======================================================
// RENDER OR CARDS
// ======================================================

function renderOperatingRooms(rooms) {

    const orGrid = document.getElementById("orGrid");

    orGrid.innerHTML = "";

    rooms.forEach(room => {

        const card = document.createElement("div");

        card.className = "or-card";

        const statusClass = getStatusClass(room.status);

        card.innerHTML = `

            <div class="or-card-top">

                <span class="or-number">
                    ${escapeHTML(room.id)}
                </span>

                <span class="status-badge ${statusClass}">
                    ${escapeHTML(room.status)}
                </span>

            </div>


            <div class="or-info">

                ${
                    room.status === "OCCUPIED"
                    ?
                    `
                    <div class="info-row">
                        <span>Procedure</span>
                        <strong>
                            ${escapeHTML(room.procedure || "Not available")}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>Surgeon</span>
                        <strong>
                            ${escapeHTML(
                                room.surgeon?.name ||
                                "Not assigned"
                            )}
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>Completion</span>
                        <strong>
                            ${escapeHTML(
                                room.expectedCompletion ||
                                "--"
                            )}
                        </strong>
                    </div>
                    `
                    :
                    `
                    <div class="available-message">
                        ${
                            room.status === "AVAILABLE"
                            ? "Ready for operation"
                            : room.status === "CLEANING"
                            ? "Cleaning in progress"
                            : "Under maintenance"
                        }
                    </div>
                    `
                }

            </div>
        `;


        // Open detailed OR information
        card.addEventListener("click", function () {

            openORDetails(room);

        });


        orGrid.appendChild(card);

    });
}


// ======================================================
// STATUS CLASS
// ======================================================

function getStatusClass(status) {

    switch (status) {

        case "AVAILABLE":
            return "status-available";

        case "OCCUPIED":
            return "status-occupied";

        case "CLEANING":
            return "status-cleaning";

        case "MAINTENANCE":
            return "status-maintenance";

        default:
            return "";
    }
}


// ======================================================
// UPDATE SUMMARY
// ======================================================

function updateSummary(rooms) {

    document.getElementById("totalORs").textContent =
        rooms.length;

    document.getElementById("availableORs").textContent =
        rooms.filter(room => room.status === "AVAILABLE").length;

    document.getElementById("occupiedORs").textContent =
        rooms.filter(room => room.status === "OCCUPIED").length;

    document.getElementById("cleaningORs").textContent =
        rooms.filter(room => room.status === "CLEANING").length;

    document.getElementById("maintenanceORs").textContent =
        rooms.filter(room => room.status === "MAINTENANCE").length;
}


// ======================================================
// OPEN OR DETAILS
// ======================================================

function openORDetails(room) {

    document.getElementById("modalORNumber").textContent =
        room.id;

    document.getElementById("modalProcedure").textContent =
        room.procedure || "--";

    /*
     * IMPORTANT:
     *
     * Surgeon information is NOT hard-coded.
     *
     * It comes from:
     *
     * room.surgeon.name
     *
     * which was obtained from your backend.
     */

    document.getElementById("modalSurgeon").textContent =
        room.surgeon?.name || "Not assigned";


    document.getElementById("modalSpecialization").textContent =
        room.surgeon?.specialization || "--";


    document.getElementById("modalCompletion").textContent =
        room.expectedCompletion || "--";


    document.getElementById("modalStatusText").textContent =
        room.status;


    const statusBadge =
        document.getElementById("modalStatus");

    statusBadge.textContent = room.status;

    statusBadge.className =
        "status-badge " + getStatusClass(room.status);


    document.getElementById("orModal")
        .classList.add("active");
}


// ======================================================
// CLOSE MODAL
// ======================================================

function closeORModal() {

    document.getElementById("orModal")
        .classList.remove("active");
}


// Close modal when clicking outside
document.getElementById("orModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeORModal();
        }

    });


// ======================================================
// SECURITY HELPER
// ======================================================

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ======================================================
// INITIAL LOAD
// ======================================================

document.addEventListener("DOMContentLoaded", () => {

    loadOperatingRooms();

});
    </script>
</body>
</html>
