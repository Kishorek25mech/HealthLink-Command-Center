<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipment | Hospital Command Center</title>

    <link rel="stylesheet" href="equipment.css">
</head>

<body>

    <div class="equipment-page">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Equipment</h1>
                <p>Monitor equipment availability across the hospital</p>
            </div>

            <button class="refresh-btn" onclick="loadEquipment()">
                ↻ Refresh
            </button>
        </div>


        <!-- Loading -->
        <div id="loading" class="loading">
            Loading equipment data...
        </div>


        <!-- Error -->
        <div id="errorMessage" class="error-message"></div>


        <!-- Equipment Container -->
        <div id="equipmentContainer" class="equipment-grid">
            <!-- Equipment cards will be generated here -->
        </div>


        <!-- Status Legend -->
        <div class="status-legend">

            <div class="legend-item">
                <span class="status-dot available"></span>
                <span>Available</span>
            </div>

            <div class="legend-item">
                <span class="status-dot limited"></span>
                <span>Limited</span>
            </div>

            <div class="legend-item">
                <span class="status-dot critical"></span>
                <span>Critical</span>
            </div>

        </div>

    </div>

    <script src="equipment.js"></script>

</body>
<body>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}


/* Main Page */

.equipment-page {
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}


/* Header */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-header h1 {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 6px;
}

.page-header p {
    color: #6b7280;
    font-size: 14px;
}


/* Refresh Button */

.refresh-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.refresh-btn:hover {
    background: #1d4ed8;
}


/* Equipment Grid */

.equipment-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}


/* Equipment Card */

.equipment-card {
    background: white;
    border-radius: 14px;
    padding: 24px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    transition: transform 0.2s, box-shadow 0.2s;
}

.equipment-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
}


/* Card Header */

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.equipment-name {
    font-size: 19px;
    font-weight: 600;
}


/* Status */

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}


/* Status Colors */

.available {
    background: #22c55e;
}

.limited {
    background: #f59e0b;
}

.critical {
    background: #ef4444;
}


/* Availability Number */

.availability {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin-bottom: 15px;
}

.available-count {
    font-size: 32px;
    font-weight: 700;
}

.total-count {
    font-size: 18px;
    color: #9ca3af;
}


/* Progress Bar */

.progress-container {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease;
}

.progress-available {
    background: #22c55e;
}

.progress-limited {
    background: #f59e0b;
}

.progress-critical {
    background: #ef4444;
}


/* Percentage */

.percentage {
    margin-top: 10px;
    font-size: 13px;
    color: #6b7280;
}


/* Loading */

.loading {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}


/* Error */

.error-message {
    display: none;
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
}


/* Legend */

.status-legend {
    display: flex;
    gap: 25px;
    margin-top: 30px;
    padding: 18px 20px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    width: fit-content;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #4b5563;
}


/* Responsive */

@media (max-width: 768px) {

    .equipment-page {
        padding: 20px;
    }

    .equipment-grid {
        grid-template-columns: 1fr;
    }

    .page-header {
        align-items: flex-start;
        gap: 15px;
    }

}

@media (max-width: 500px) {

    .page-header {
        flex-direction: column;
    }

    .refresh-btn {
        width: 100%;
    }

    .status-legend {
        width: 100%;
        justify-content: space-between;
        gap: 10px;
    }

}


    </style>
</body>
<body>
    <script>

const API_URL = "/api/hospital/equipment";


// Load equipment when page opens
document.addEventListener("DOMContentLoaded", loadEquipment);


// Fetch equipment from backend
async function loadEquipment() {

    const container = document.getElementById("equipmentContainer");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");

    loading.style.display = "block";
    errorMessage.style.display = "none";
    container.innerHTML = "";

    try {

        const response = await fetch(API_URL, {
            method: "GET",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include"
        });


        if (!response.ok) {
            throw new Error("Unable to fetch equipment data.");
        }


        const data = await response.json();


        loading.style.display = "none";


        if (!data.equipment || data.equipment.length === 0) {

            container.innerHTML = `
                <div class="loading">
                    No equipment data available.
                </div>
            `;

            return;
        }


        displayEquipment(data.equipment);


    } catch (error) {

        console.error("Equipment loading error:", error);

        loading.style.display = "none";

        errorMessage.textContent =
            "Unable to load equipment data. Please try again.";

        errorMessage.style.display = "block";
    }
}



// Display equipment cards
function displayEquipment(equipmentList) {

    const container =
        document.getElementById("equipmentContainer");


    equipmentList.forEach(equipment => {

        const total = Number(equipment.total) || 0;
        const available = Number(equipment.available) || 0;


        // Prevent invalid percentages
        let percentage = 0;

        if (total > 0) {
            percentage = (available / total) * 100;
        }


        /*
            Status logic:

            > 50%       Available
            20 - 50%    Limited
            < 20%       Critical
        */

        let status;
        let statusClass;

        if (percentage > 50) {

            status = "Available";
            statusClass = "available";

        } else if (percentage >= 20) {

            status = "Limited";
            statusClass = "limited";

        } else {

            status = "Critical";
            statusClass = "critical";
        }


        const card = document.createElement("div");

        card.className = "equipment-card";


        card.innerHTML = `

            <div class="card-header">

                <div class="equipment-name">
                    ${escapeHTML(equipment.name)}
                </div>

                <div class="status">

                    <span class="status-dot ${statusClass}">
                    </span>

                    <span>
                        ${status}
                    </span>

                </div>

            </div>


            <div class="availability">

                <span class="available-count">
                    ${available}
                </span>

                <span class="total-count">
                    / ${total} available
                </span>

            </div>


            <div class="progress-container">

                <div
                    class="progress-bar progress-${statusClass}"
                    style="width: ${percentage}%">
                </div>

            </div>


            <div class="percentage">
                ${percentage.toFixed(0)}% currently available
            </div>

        `;


        container.appendChild(card);

    });

}



// Basic HTML escaping
// Prevents backend text from being inserted as raw HTML

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


    </script>
</body>
</html>
